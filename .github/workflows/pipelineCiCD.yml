  SCA:
    # Eliminamos la dependencia de SAST
    # needs: SAST
    name: Software Composition Analysis (SCA)
    runs-on: ubuntu-24.04

    steps:
      # Verificar y descargar código
      - name: Checkout Code
        uses: actions/checkout@v3

      # Configurar Java para proyectos con Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'

      # Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # Ajustar según la versión necesaria para tu proyecto

      # Instalar dependencias del proyecto
      - name: Install Node.js Dependencies
        run: |
          echo "Instalando dependencias del proyecto con npm..."
          npm install

      # Ejecutar Dependency Check
      - name: Dependency Check
        uses: dependency-check/Dependency-Check_Action@1.1.0
        env:
          JAVA_HOME: /opt/jdk
        id: Depcheck
        with:
          project: 'GLemos-AS_laboratorio-final-glemos2'
          path: '.'
          format: 'HTML'
          args: >
            --out ./reports
            --failOnCVSS 7
            --enableRetired

      # Subir reporte del análisis
      - name: Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: ./reports

      # Contar vulnerabilidades
      - name: Contar vulnerabilidades por severidad
        run: |
          echo "Analizando el reporte de dependencias para contar vulnerabilidades..."
          REPORT_PATH="./reports/dependency-check-report.html"

          if [ -f "$REPORT_PATH" ]; then
            critical_count=$(grep -i 'Critical' "$REPORT_PATH" | wc -l)
            high_count=$(grep -i 'High' "$REPORT_PATH" | wc -l)
            medium_count=$(grep -i 'Medium' "$REPORT_PATH" | wc -l)

            echo "Vulnerabilidades críticas: $critical_count"
            echo "Vulnerabilidades altas: $high_count"
            echo "Vulnerabilidades medias: $medium_count"

            if [ "$critical_count" -gt 0 ]; then
              echo "Se encontraron vulnerabilidades críticas. Deteniendo pipeline."
              # exit 1
            elif [ "$high_count" -gt 0 ]; then
              echo "Se encontraron vulnerabilidades altas. Deteniendo pipeline."
              # exit 1
            elif [ "$medium_count" -gt 0 ]; then
              echo "Se encontraron vulnerabilidades medias. Deteniendo pipeline."
              # exit 1
            else
              echo "No se encontraron vulnerabilidades críticas, altas o medias."
            fi
          else
            echo "No se encontró el reporte de dependencias en $REPORT_PATH. Revisar ejecución."
            exit 1
          fi

  DockerBuild:
    needs: SCA
    name: Build Docker Image
    runs-on: ubuntu-24.04
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/laboratorio_final_glemos
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Docker Login
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:latest \
                       -t $IMAGE_NAME:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}

  DockerScan:
    needs: DockerBuild
    name: Scan Docker Image
    runs-on: ubuntu-24.04
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/laboratorio_final_glemos
    steps:
      - name: Docker Login
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Ejecutar Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/laboratorio_final_glemos:latest
          format: json
          output: trivy-scan-report.json
          args: --skip-files /root/.npm/_cacache/content-v2/

      - name: Verificar salida de Trivy
        run: cat trivy-scan-report.json

      - name: Validar contenido del reporte
        run: |
          if ! jq -e '.Results | length > 0' trivy-scan-report.json > /dev/null; then
            echo "No se encontraron vulnerabilidades. Pipeline aprobado."
            exit 0
          fi

      - name: Analizar vulnerabilidades
        run: |
          CRITICAL=$(jq '[.Results[].Vulnerabilities[] | select(.Severity == "CRITICAL")] | length' trivy-scan-report.json)
          HIGH=$(jq '[.Results[].Vulnerabilities[] | select(.Severity == "HIGH")] | length' trivy-scan-report.json)
          MEDIUM=$(jq '[.Results[].Vulnerabilities[] | select(.Severity == "MEDIUM")] | length' trivy-scan-report.json)
          LOW=$(jq '[.Results[].Vulnerabilities[] | select(.Severity == "LOW")] | length' trivy-scan-report.json)
          TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW))
          
          echo "Resumen de vulnerabilidades:"
          echo "Críticas: $CRITICAL"
          echo "Altas: $HIGH"
          echo "Medias: $MEDIUM"
          echo "Bajas: $LOW"
          echo "Total: $TOTAL"
          
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ] || [ "$MEDIUM" -gt 0 ]; then
            echo "¡Se detectaron vulnerabilidades críticas, altas o medias! Fallando el pipeline..."
            exit 1
          fi

      - name: Subir reporte de Trivy como artefacto
        uses: actions/upload-artifact@v3
        with:
          name: trivy-scan-report
          path: trivy-scan-report.json
