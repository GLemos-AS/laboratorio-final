  DockerBuild:
    # needs: SCA
    name: Build Docker Image
    runs-on: ubuntu-24.04
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/laboratorio_final_glemos
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Docker Login
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:latest \
                       -t $IMAGE_NAME:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}

  DockerScan:
    needs: DockerBuild
    name: Scan Docker Image
    runs-on: ubuntu-24.04
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/laboratorio_final_glemos
    steps:
      - name: Docker Login
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Ejecutar Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/laboratorio_final_glemos:latest
          format: json
          output: trivyreport.json
          skip-dirs: .cache
      
      # - name: Ver estructura básica del JSON
      #   run: |
      #     echo "=== Primeras 20 líneas del archivo ==="
      #     head -n 20 trivyreport.json
            
      #     echo -e "\n=== Estructura general del JSON ==="
      #     jq 'keys' trivyreport.json
            
      #     echo -e "\n=== Estructura de Results ==="
      #     jq '.Results | map(keys)' trivyreport.json
            
      #     echo -e "\n=== Número total de resultados ==="
      #     jq '.Results | length' trivyreport.json
            
      #     echo -e "\n=== Tipos de vulnerabilidades encontradas ==="
      #     jq '.Results[].Vulnerabilities[]? | .Severity' trivyreport.json | sort | uniq -c || echo "No se encontraron vulnerabilidades"  

      - name: Verificar archivo generado
        run: |
          if [ ! -f trivyreport.json ]; then
            echo "El archivo trivyreport.json no se generó."
            exit 1
          fi
          echo "Archivo JSON generado correctamente:"
          cat trivyreport.json
      
      - name: Inspeccionar estructura JSON
        run: |
          echo "Mostrando estructura del archivo JSON generado por Trivy:"
          jq '.' trivyreport.json
      
      - name: Validar contenido del reporte
        run: |
          if ! jq -e '.Results | length > 0' trivyreport.json > /dev/null; then
            echo "No se encontraron vulnerabilidades. Pipeline aprobado."
            exit 0
          fi

      - name: Analizar vulnerabilidades
        run: |
          # Primero verificamos si hay resultados
          if ! jq -e '.Results' trivyreport.json > /dev/null; then
            echo "No se encontraron resultados en el escaneo"
            exit 0
          fi

          # Inicializamos contadores
          CRITICAL=0
          HIGH=0
          MEDIUM=0
          LOW=0

          # Contamos vulnerabilidades solo si existen
          if jq -e '.Results[].Vulnerabilities' trivyreport.json > /dev/null; then
            CRITICAL=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivyreport.json)
            HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivyreport.json)
            MEDIUM=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivyreport.json)
            LOW=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "LOW")] | length' trivyreport.json)
          fi
          
          TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW))
          
          echo "Resumen de vulnerabilidades:"
          echo "Críticas: $CRITICAL"
          echo "Altas: $HIGH"
          echo "Medias: $MEDIUM"
          echo "Bajas: $LOW"
          echo "Total: $TOTAL"
          
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ] || [ "$MEDIUM" -gt 0 ]; then
            echo "¡Se detectaron vulnerabilidades críticas, altas o medias! Fallando el pipeline..."
            # exit 1
          fi

      - name: Subir reporte de Trivy como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: trivyreport
          path: trivyreport.json

  Deploy:
      needs: DockerScan
      name: Desplegar Contenedor Docker
      runs-on: ubuntu-24.04
      env:
        IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/laboratorio_final_glemos
        CONTAINER_NAME: laboratorio_glemos
      steps:
        - name: Checkout del código
          uses: actions/checkout@v3

        - name: Docker Login
          uses: docker/login-action@v3.0.0
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Pull Docker Image
          run: docker pull $IMAGE_NAME:latest

        - name: Iniciar contenedor Docker
          run: |
            echo "Iniciando contenedor Docker..."
            docker run -d --name $CONTAINER_NAME -p 3000:3000 $IMAGE_NAME:latest
            echo "Contenedor iniciado con éxito."

        - name: Verificar contenedor
          run: |
            echo "Verificando que el contenedor esté corriendo..."
            docker ps | grep $CONTAINER_NAME || (echo "El contenedor no está corriendo" && exit 1)


        - name: Verificar el despliegue
          run: |
            sleep 10
            if [ "$(docker ps -q -f name=$CONTAINER_NAME)" ]; then
              echo "✅ Contenedor desplegado exitosamente"
              docker ps
              echo "La aplicación debería estar disponible en http://localhost:3000"
            else
              echo "❌ Error en el despliegue del contenedor"
              docker logs $CONTAINER_NAME
              exit 1
            fi
        - name: Mostrar curl de sitio
          run: |
            echo "Inicio de web"
            curl  http://localhost:3000
            echo "Fin de web"

        - name: Detener y eliminar el contenedor
          run: |
            echo "Deteniendo y eliminando el contenedor..."
            docker stop $CONTAINER_NAME
            docker rm $CONTAINER_NAME