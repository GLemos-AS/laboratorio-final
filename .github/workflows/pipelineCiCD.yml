name: Laboratorio Final

on:
  push:
  workflow_dispatch:

jobs:
  SAST:
    name: Static Application Security Testing (SAST) con SonarCloud
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Environment Variables
        run: echo "BRANCH_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          echo "Instalando dependencias del proyecto..."
          npm install

      - name: Validate Project in SonarCloud
        id: validateProjectOnSonar
        run: |
          PROJECT_NAME="${{ github.event.repository.name }}"
          ORGANIZATION="glemosas"
          
          echo "Verificando si el proyecto '${PROJECT_NAME}' ya existe en SonarCloud..."

          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST -u "${{ secrets.SONAR_TOKEN }}:" \
            "https://sonarcloud.io/api/projects/create" \
            -d "name=${PROJECT_NAME}" \
            -d "project=${PROJECT_NAME}" \
            -d "organization=${ORGANIZATION}" \
            -d "visibility=public")

          if [ "$response" -eq 400 ]; then
            echo "Proyecto '${PROJECT_NAME}' ya existe en SonarCloud"
            echo "project_created=false" >> $GITHUB_ENV
          elif [ "$response" -eq 200 ]; then
            echo "Proyecto '${PROJECT_NAME}' creado exitosamente en SonarCloud"
            echo "project_created=true" >> $GITHUB_ENV
          else
            echo "Error al crear el proyecto en SonarCloud. Código de respuesta: $response"
            exit 1
          fi

      - name: Perform SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Realizando análisis en SonarCloud..."
          npx sonar-scanner \
            -Dsonar.projectKey=${{ github.event.repository.name }} \
            -Dsonar.organization=glemosas \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.sources=src \
            -Dsonar.language=ts \
            -Dsonar.branch.name=${{ github.ref_name }}

      - name: Validate Quality Gate and Count Vulnerabilities
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Validando el estado del Quality Gate y revisando vulnerabilidades..."
          REPO_NAME="${{ github.event.repository.name }}"

          # Obtener el ID del análisis más reciente
          analysisId=$(curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/ce/component?component=$REPO_NAME" | jq -r '.current.analysisId')

          if [ -z "$analysisId" ]; then
            echo "No se encontró un análisis reciente. Verifique la configuración."
            exit 1
          fi

          # Validar el estado del Quality Gate
          qualityGateStatus=$(curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/qualitygates/project_status?analysisId=$analysisId" | jq -r '.projectStatus.status')

          echo "Estado del Quality Gate: $qualityGateStatus"
          # Verificar si el Quality Gate pasó o falló
          if [ "$qualityGateStatus" != "OK" ]; then
            echo "El proyecto no cumple con el Quality Gate: $qualityGateStatus."
            
            # Consultar vulnerabilidades y issues de Maintainability (CODE_SMELL)
            critical=$(curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?componentKeys=$REPO_NAME&types=VULNERABILITY&severities=CRITICAL" | jq -r '.total')
            high=$(curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?componentKeys=$REPO_NAME&types=VULNERABILITY&severities=HIGH" | jq -r '.total')
            medium=$(curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?componentKeys=$REPO_NAME&types=VULNERABILITY&severities=MEDIUM" | jq -r '.total')
            
            maintainabilityCritical=$(curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?componentKeys=$REPO_NAME&types=CODE_SMELL&severities=CRITICAL" | jq -r '.total')
            maintainabilityHigh=$(curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?componentKeys=$REPO_NAME&types=CODE_SMELL&severities=HIGH" | jq -r '.total')
            maintainabilityMedium=$(curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?componentKeys=$REPO_NAME&types=CODE_SMELL&severities=MEDIUM" | jq -r '.total')

            # Si hay vulnerabilidades críticas, altas o medias, falla el pipeline
            if [ "$critical" -gt 0 ]; then
              echo "Se encontraron $critical vulnerabilidades críticas. Falla el pipeline."
              exit 1
            elif [ "$high" -gt 0 ]; then
              echo "Se encontraron $high vulnerabilidades altas. Falla el pipeline."
              exit 1
            elif [ "$medium" -gt 0 ]; then
              echo "Se encontraron $medium vulnerabilidades medias. Falla el pipeline."
              exit 1
            # Si hay problemas de maintainability críticos, altos o medios, falla el pipeline
            elif [ "$maintainabilityCritical" -gt 0 ]; then
              echo "Se encontraron $maintainabilityCritical problemas críticos de mantenibilidad. Falla el pipeline."
              exit 1
            elif [ "$maintainabilityHigh" -gt 0 ]; then
              echo "Se encontraron $maintainabilityHigh problemas altos de mantenibilidad. Falla el pipeline."
              exit 1
            elif [ "$maintainabilityMedium" -gt 0 ]; then
              echo "Se encontraron $maintainabilityMedium problemas medios de mantenibilidad. Falla el pipeline."
              exit 1
            fi
          else
            echo "El proyecto cumple con el Quality Gate."
          fi
